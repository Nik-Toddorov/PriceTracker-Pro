<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="app_title">Price Tracker Pro</title>
    <style>
        :root, html.theme-light {
            --bg-main: #f9f9f9;
            --bg-container: #fff;
            --text-main: #333;
            --text-muted: #666;
            --text-strong: #000;
            --link-color: #007bff;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --success-bg: #f0fff4;
            --border-color: #ddd;
            --header-bg: #f8f9fa;
            --row-border: #eee;
            --modal-bg: #fefefe;
            --btn-bg: #007bff;
            --btn-text: #ffffff;
            --btn-success-bg: #28a745;
            --btn-success-text: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            html:not(.theme-light) {
                --bg-main: #131314;
                --bg-container: #1e1f20;
                --text-main: #e3e3e3;
                --text-muted: #c4c7c5;
                --text-strong: #ffffff;
                --link-color: #a8c7fa;
                --success-color: #81c995;
                --danger-color: #f28b82;
                --success-bg: #0f5223;
                --border-color: #444746;
                --header-bg: #282a2c;
                --row-border: #444746;
                --modal-bg: #1e1f20;
                --btn-bg: #a8c7fa;
                --btn-text: #041e49;
                --btn-success-bg: #81c995;
                --btn-success-text: #003314;
            }
        }

        html.theme-dark {
            --bg-main: #131314;
            --bg-container: #1e1f20;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --text-strong: #ffffff;
            --link-color: #a8c7fa;
            --success-color: #81c995;
            --danger-color: #f28b82;
            --success-bg: #0f5223;
            --border-color: #444746;
            --header-bg: #282a2c;
            --row-border: #444746;
            --modal-bg: #1e1f20;
            --btn-bg: #a8c7fa;
            --btn-text: #041e49;
            --btn-success-bg: #81c995;
            --btn-success-text: #003314;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; width: 500px; max-height: 600px; }
        h3 { margin-top: 0; color: var(--link-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; text-align: center; }
        button { background-color: var(--btn-bg); color: var(--btn-text); border: none; padding: 8px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: background-color 0.2s; }
        button:hover { opacity: 0.9; }
        button.success { background-color: var(--success-color); }
        button.success:hover { opacity: 0.9; }
        .category-block { border: 1px solid var(--border-color); margin-bottom: 15px; border-radius: 5px; overflow: hidden; background: var(--bg-container); }
        .category-header { background: var(--header-bg); padding: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); font-size: 14px;}
        .item-row { padding: 10px; border-bottom: 1px dashed var(--row-border); display: flex; justify-content: space-between; align-items: center; font-size: 13px;}
        .item-row:last-child { border-bottom: none; }
        .item-details { flex-grow: 1; }
        .item-actions button { padding: 4px 8px; font-size: 11px; margin-left: 3px; }
        .header-actions button { padding: 4px 8px; font-size: 11px; }
        #trackedItemsList { max-height: 400px; overflow-y: auto; margin-bottom: 15px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: var(--modal-bg); margin: 5% auto; padding: 15px; border: 1px solid var(--border-color); width: 90%; border-radius: 8px; position: relative; }
        .close-btn { color: var(--text-muted); float: right; font-size: 24px; font-weight: bold; cursor: pointer; margin-top: -10px;}
        .close-btn:hover, .close-btn:focus { color: var(--text-strong); text-decoration: none; cursor: pointer; }
        .chart-container { position: relative; height: 250px; width: 100%; }
        .success { background-color: var(--btn-success-bg) !important; color: var(--btn-success-text) !important; }
    </style>
    <script src="chart.umd.js"></script>
</head>
<body>
    <h3 data-i18n="app_title">Price Tracker Pro</h3>
    
    <button id="refreshAllBtn" style="background-color: var(--success-color); margin-bottom: 15px; width: 100%;" data-i18n="refresh_all_btn">🔄 Refresh All Sites</button>
    
    <div id="trackedItemsList">
        <p style="text-align:center;" data-i18n="loading">Loading...</p>
    </div>

    <button id="openOptionsBtn" style="width: 100%;" data-i18n="settings_btn">⚙️ Open Full Settings</button>
    
    <!-- Chart Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h4 id="modalTitle" style="margin-top:0;">Price History</h4>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="popup.js" charset="utf-8"></script>
</body>
</html>
