<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="app_title">Price Tracker Pro</title>
    <style>
        :root, html.theme-light {
            --bg-main: #f9f9f9;
            --bg-container: #fff;
            --text-main: #333;
            --text-muted: #666;
            --text-strong: #000;
            --link-color: #007bff;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --success-bg: #f0fff4;
            --border-color: #ddd;
            --header-bg: #f8f9fa;
            --row-border: #eee;
            --modal-bg: #fefefe;
            --btn-bg: #007bff;
            --btn-text: #ffffff;
            --btn-success-bg: #28a745;
            --btn-success-text: #ffffff;
            --highlight-bg: #fff8e1;
            --highlight-border: #ffe082;
            --diff-ins-bg: #fff3cd;
            --diff-ins-color: #856404;
            --diff-del-bg: #f8d7da;
            --diff-del-color: #721c24;
        }

        @media (prefers-color-scheme: dark) {
            html:not(.theme-light) {
                --bg-main: #131314;
                --bg-container: #1e1f20;
                --text-main: #e3e3e3;
                --text-muted: #c4c7c5;
                --text-strong: #ffffff;
                --link-color: #a8c7fa;
                --success-color: #81c995;
                --danger-color: #f28b82;
                --success-bg: #0f5223;
                --border-color: #444746;
                --header-bg: #282a2c;
                --row-border: #444746;
                --modal-bg: #1e1f20;
                --btn-bg: #a8c7fa;
                --btn-text: #041e49;
                --btn-success-bg: #81c995;
                --btn-success-text: #003314;
                --highlight-bg: #2b2308;
                --highlight-border: #735300;
                --diff-ins-bg: #4d3800;
                --diff-ins-color: #ffecb3;
                --diff-del-bg: #4a151b;
                --diff-del-color: #f8b4b8;
            }
        }

        html.theme-dark {
            --bg-main: #131314;
            --bg-container: #1e1f20;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --text-strong: #ffffff;
            --link-color: #a8c7fa;
            --success-color: #81c995;
            --danger-color: #f28b82;
            --success-bg: #0f5223;
            --border-color: #444746;
            --header-bg: #282a2c;
            --row-border: #444746;
            --modal-bg: #1e1f20;
            --btn-bg: #a8c7fa;
            --btn-text: #041e49;
            --btn-success-bg: #81c995;
            --btn-success-text: #003314;
            --highlight-bg: #2b2308;
            --highlight-border: #735300;
            --diff-ins-bg: #4d3800;
            --diff-ins-color: #ffecb3;
            --diff-del-bg: #4a151b;
            --diff-del-color: #f8b4b8;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; width: 520px; max-height: 600px; }
        h3 { margin-top: 0; color: var(--link-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; text-align: center; }
        button { background-color: var(--btn-bg); color: var(--btn-text); border: none; padding: 8px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: background-color 0.2s; }
        button:hover { opacity: 0.9; }
        button.success { background-color: var(--success-color); }
        button.success:hover { opacity: 0.9; }
        .category-block { border: 1px solid var(--border-color); margin-bottom: 15px; border-radius: 5px; overflow: hidden; background: var(--bg-container); }
        .category-header { background: var(--header-bg); padding: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); font-size: 14px;}
        .item-row { padding: 10px; border-bottom: 1px dashed var(--row-border); display: flex; justify-content: space-between; align-items: flex-start; font-size: 13px; gap: 10px; }
        .item-row:last-child { border-bottom: none; }
        .item-details { flex-grow: 1; min-width: 0; }
        .item-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        .item-actions button { padding: 4px 8px; font-size: 11px; }
        .header-actions button { padding: 4px 8px; font-size: 11px; }
        #trackedItemsList { max-height: 400px; overflow-y: auto; margin-bottom: 15px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: var(--modal-bg); margin: 5% auto; padding: 15px; border: 1px solid var(--border-color); width: 90%; border-radius: 8px; position: relative; }
        .close-btn { color: var(--text-muted); float: right; font-size: 24px; font-weight: bold; cursor: pointer; margin-top: -10px;}
        .close-btn:hover, .close-btn:focus { color: var(--text-strong); text-decoration: none; cursor: pointer; }
        .chart-container { position: relative; height: 250px; width: 100%; }
        .success { background-color: var(--btn-success-bg) !important; color: var(--btn-success-text) !important; }

        /* Text tracking & diff styles */
        .text-changed-box {
            background-color: var(--highlight-bg);
            border: 1px solid var(--highlight-border);
            border-radius: 4px;
            padding: 6px 8px;
            margin-top: 4px;
            font-size: 12px;
            line-height: 1.4;
            word-break: break-word;
        }
        .text-preview-box {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 6px;
            margin-top: 3px;
            font-size: 12px;
            word-break: break-word;
            color: var(--text-main);
        }
        .badge-text-changed {
            background-color: #ffc107;
            color: #212529;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
            display: inline-block;
            margin-left: 4px;
            vertical-align: middle;
        }
        mark.diff-ins, .diff-ins {
            background-color: var(--diff-ins-bg);
            color: var(--diff-ins-color);
            padding: 1px 3px;
            border-radius: 2px;
            font-weight: bold;
            text-decoration: none;
        }
        del.diff-del, .diff-del {
            background-color: var(--diff-del-bg);
            color: var(--diff-del-color);
            text-decoration: line-through;
            padding: 1px 3px;
            border-radius: 2px;
            margin-right: 2px;
        }
        .btn-mark-reviewed {
            background-color: #ffc107 !important;
            color: #212529 !important;
            border: none;
            padding: 3px 6px !important;
            font-size: 10px !important;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 4px;
        }
        .btn-mark-reviewed:hover {
            background-color: #e0a800 !important;
        }
        .text-history-timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding: 5px;
        }
        .text-history-card {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 10px;
        }
        .text-history-card.latest {
            border-left: 4px solid #ffc107;
        }
        .text-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            border-bottom: 1px dashed var(--row-border);
            padding-bottom: 4px;
        }
    </style>
    <script src="chart.umd.js"></script>
</head>
<body>
    <h3 data-i18n="app_title">Price Tracker Pro</h3>
    
    <button id="refreshAllBtn" style="background-color: var(--success-color); margin-bottom: 15px; width: 100%;" data-i18n="refresh_all_btn">🔄 Refresh All Sites</button>
    
    <div id="trackedItemsList">
        <p style="text-align:center;" data-i18n="loading">Loading...</p>
    </div>

    <button id="openOptionsBtn" style="width: 100%;" data-i18n="settings_btn">⚙️ Open Full Settings</button>
    
    <!-- Modal for Price Chart and Text History -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h4 id="modalTitle" style="margin-top:0;">History</h4>
            <div id="priceChartContainer" class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
            <div id="textHistoryContainer" style="display: none;"></div>
        </div>
    </div>

    <script type="module" src="popup.js" charset="utf-8"></script>
</body>
</html>
